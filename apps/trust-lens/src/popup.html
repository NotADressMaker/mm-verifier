<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trust Lens</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 12px;
        width: 320px;
      }
      .section {
        margin-bottom: 12px;
      }
      .label {
        font-weight: bold;
      }
      .flags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .flag {
        padding: 4px 6px;
        border-radius: 4px;
        background: #fee2e2;
        color: #991b1b;
        font-size: 11px;
      }
      .ok {
        background: #dcfce7;
        color: #166534;
      }
    </style>
  </head>
  <body>
    <div class="section">
      <div class="label">Receipt</div>
      <div id="receiptId">No receipt detected</div>
      <div id="workHash"></div>
    </div>
    <div class="section">
      <div class="label">Latest Verification</div>
      <div id="summary"></div>
    </div>
    <div class="section">
      <div class="label">Risk Flags</div>
      <div id="flags" class="flags"></div>
    </div>
    <div class="section">
      <button id="openReceipt">Open receipt</button>
      <button id="openDashboard">Open dashboard</button>
    </div>
    <script src="risk.js"></script>
    <script src="apiClient.js"></script>
    <script src="receiptParser.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
