version: '3.8'

services:
  # Redis for job queue and caching
  redis:
    image: redis:7-alpine
    container_name: mmverifier-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for API data
  postgres:
    image: postgres:15-alpine
    container_name: mmverifier-postgres
    environment:
      POSTGRES_DB: mmverifier
      POSTGRES_USER: verifier
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U verifier']
      interval: 10s
      timeout: 5s
      retries: 5

  # IPFS for evidence storage
  ipfs:
    image: ipfs/kubo:latest
    container_name: mmverifier-ipfs
    ports:
      - '4001:4001' # P2P
      - '5001:5001' # API
      - '8080:8080' # Gateway
    volumes:
      - ipfs-data:/data/ipfs
    environment:
      IPFS_PROFILE: server

  # Local Hardhat node for development
  hardhat:
    build:
      context: ./contracts
      dockerfile: Dockerfile.hardhat
    container_name: mmverifier-hardhat
    ports:
      - '8545:8545'
    volumes:
      - ./contracts:/app
      - hardhat_cache:/app/cache
      - hardhat_artifacts:/app/artifacts
    command: npx hardhat node
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8545 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

  # API server
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mmverifier-api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      API_PORT: 3000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://verifier:${DB_PASSWORD:-changeme}@postgres:5432/mmverifier
      MOCK_VERIFIER: ${MOCK_VERIFIER:-false}
      MOCK_CHAIN: ${MOCK_CHAIN:-false}
      MOCK_SCENARIO: ${MOCK_SCENARIO:-happy}
      ARBITRUM_SEPOLIA_RPC_URL: ${ARBITRUM_SEPOLIA_RPC_URL}
      PRIVATE_KEY: ${PRIVATE_KEY}
      MARKETPLACE_ADDRESS: ${MARKETPLACE_ADDRESS}
      STAKING_ADDRESS: ${STAKING_ADDRESS}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Verifier node
  verifier-node:
    build:
      context: ./verifier-node
      dockerfile: Dockerfile
    container_name: mmverifier-node
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      IPFS_API_URL: http://ipfs:5001
      MOCK_VERIFIER: ${MOCK_VERIFIER:-false}
      MOCK_SCENARIO: ${MOCK_SCENARIO:-happy}
      ARBITRUM_SEPOLIA_RPC_URL: ${ARBITRUM_SEPOLIA_RPC_URL}
      VERIFIER_PRIVATE_KEY: ${VERIFIER_PRIVATE_KEY}
      MARKETPLACE_ADDRESS: ${MARKETPLACE_ADDRESS}
      STAKING_ADDRESS: ${STAKING_ADDRESS}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      AUTO_REGISTER_VERIFIER: 'true'
    depends_on:
      redis:
        condition: service_healthy
      ipfs:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  ipfs-data:
  hardhat_cache:
  hardhat_artifacts:

networks:
  default:
    name: mmverifier-network
