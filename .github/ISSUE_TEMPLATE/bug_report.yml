name: Bug report
description: Report a reproducible problem with MAMV.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a problem. Do not include secrets, API keys, or private receipt contents."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Submit ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MAMV version or commit
      placeholder: "e.g. v0.1.0 or abc1234"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js version, package-manager version, and relevant deployment details.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact secrets and personally identifiable information.
