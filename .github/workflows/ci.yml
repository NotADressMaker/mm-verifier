name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  contracts:
    name: Smart Contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        working-directory: contracts
        run: npm ci

      - name: Compile contracts
        working-directory: contracts
        run: npm run compile

      - name: Run tests
        working-directory: contracts
        run: npm test

      - name: Coverage
        working-directory: contracts
        run: npm run coverage

  api:
    name: API Server
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Build
        working-directory: api
        run: npm run build

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Run tests
        working-directory: api
        run: npm test

  verifier-node:
    name: Verifier Node
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: verifier-node/package-lock.json

      - name: Install dependencies
        working-directory: verifier-node
        run: npm ci

      - name: Build
        working-directory: verifier-node
        run: npm run build

      - name: Lint
        working-directory: verifier-node
        run: npm run lint

      - name: Run tests
        working-directory: verifier-node
        run: npm test

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build API Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./api
          push: false
          tags: llm-verifier-api:latest

      - name: Build Verifier Node Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./verifier-node
          push: false
          tags: llm-verifier-node:latest
