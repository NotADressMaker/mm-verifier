name: CI

on:
  push:
    branches: [ "main", "master", "claude/multi-llm-verifier-IDKkb" ]
  pull_request:
    branches: [ "main", "master", "claude/multi-llm-verifier-IDKkb" ]

jobs:
  node-build-and-test:
    name: Node: lint, build, test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint (TypeScript / JS)
        run: npm run lint       # remove '|| true' so lint failures fail the job

      - name: Build (if applicable)
        run: npm run build      # keep this, will be a no-op if not used

      - name: Run tests
        # produce test-junit files if your test runner supports it; adjust as needed
        run: npm test

      - name: Upload test results (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-results/**       # adjust to where your tests emit results

  solidity-analysis:
    name: Solidity: compile, solhint & slither
    runs-on: ubuntu-latest
    needs: node-build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node deps (for solhint etc.)
        run: npm ci

      - name: Run Solhint (Solidity linter)
        run: npx solhint 'contracts/**/*.sol'

      - name: Compile contracts (Hardhat example)
        # Change this to 'forge build' if you use Foundry, or to your project's compile command.
        run: |
          if [ -f hardhat.config.* ] || [ -f hardhat.config.js ]; then
            npx hardhat compile
          elif command -v forge >/dev/null 2>&1; then
            forge build
          else
            echo "No recognized Solidity build tool found; skipping compile step"
          fi

      - name: Run Slither (Docker container)
        # Slither needs the built artifacts; the compile step above should create them.
        run: |
          mkdir -p slither-results || true
          docker run --rm -v "${{ github.workspace }}":/src -w /src crytic/slither:latest slither . --json slither-results/slither.json || true

      - name: Upload slither results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-results
          path: slither-results/**
